<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PI Remote passwordless authenticator login</title>
  <desc id="desc">Dark industrial access-code screen requiring one six-digit TOTP code and no username</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#182226" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c7ff31" stop-opacity=".1"/><stop offset="1" stop-color="#c7ff31" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="#080b0d"/><rect width="1280" height="720" fill="url(#grid)" opacity=".5"/><circle cx="315" cy="390" r="270" fill="url(#glow)"/>
  <rect x="24" y="20" width="1232" height="60" fill="#10161a" stroke="#263038"/><rect x="41" y="29" width="42" height="42" fill="#111a17" stroke="#6c8d36"/>
  <path d="M53 39h12l7 7v17H53zM65 39v8h7M57 53h11M57 58h7" fill="none" stroke="#c7ff31" stroke-width="1.6"/>
  <text x="96" y="57" fill="#e9f0f2" font-family="monospace" font-size="22" font-weight="700">PI//REMOTE</text><text x="276" y="55" fill="#7f8b91" font-family="monospace" font-size="11" letter-spacing="2">EDGE CONSOLE · 01</text>
  <text x="1016" y="56" fill="#aab6b0" font-family="monospace" font-size="11">SSH TUNNEL + TOTP</text><circle cx="1225" cy="50" r="4" fill="#70e7a2"/><text x="1236" y="54" fill="#70e7a2" font-family="monospace" font-size="9">ONLINE</text>
  <rect x="258" y="132" width="764" height="510" fill="#0e1416" stroke="#334037"/><line x1="258" y1="132" x2="1022" y2="132" stroke="#c7ff31" stroke-opacity=".5"/><text x="943" y="160" fill="#6e7c75" font-family="monospace" font-size="10" letter-spacing="2">AUTH//01</text>
  <rect x="258" y="132" width="226" height="510" fill="#090f11"/><rect x="258" y="132" width="226" height="510" fill="url(#grid)" opacity=".75"/><line x1="484" y1="132" x2="484" y2="642" stroke="#263038"/>
  <circle cx="371" cy="373" r="82" fill="none" stroke="#33432d"/><circle cx="371" cy="373" r="57" fill="none" stroke="#7da03d" stroke-dasharray="3 8"/><circle cx="371" cy="373" r="4" fill="#70e7a2"/>
  <path d="M345 368v-15a26 26 0 0 1 52 0v15M337 368h68v52h-68zM371 385v18" fill="none" stroke="#c7ff31" stroke-width="2"/><text x="327" y="493" fill="#6f7c76" font-family="monospace" font-size="10" letter-spacing="2">AUTH REQUIRED</text>
  <text x="541" y="208" fill="#c7ff31" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">IDENTITY CHECK · TOTP</text><text x="541" y="256" fill="#eef4f5" font-family="sans-serif" font-size="34" font-weight="700">Enter your access code</text>
  <text x="541" y="292" fill="#8b9791" font-family="sans-serif" font-size="14">Open your authenticator app and enter the current six-digit code.</text><text x="541" y="315" fill="#8b9791" font-family="sans-serif" font-size="14">No username or account is required.</text>
  <text x="541" y="366" fill="#89968f" font-family="monospace" font-size="10" letter-spacing="1">AUTHENTICATOR CODE</text><rect x="541" y="380" width="424" height="54" fill="#090d10" stroke="#3a4843"/><rect x="542" y="381" width="66" height="52" fill="#0c1413"/><line x1="608" y1="381" x2="608" y2="433" stroke="#2c3738"/>
  <text x="557" y="412" fill="#c7ff31" font-family="monospace" font-size="10" font-weight="700">TOTP</text><text x="649" y="416" fill="#eef4f5" font-family="monospace" font-size="24" font-weight="700" letter-spacing="11">483921</text>
  <path d="M541 462h413l11 11v45H541z" fill="#c7ff31"/><path d="M562 490h18M575 483l7 7-7 7" fill="none" stroke="#10160a" stroke-width="2"/><text x="700" y="495" fill="#10160a" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">UNLOCK CONSOLE</text>
  <line x1="541" y1="552" x2="965" y2="552" stroke="#293436"/><text x="541" y="579" fill="#6f7b75" font-family="monospace" font-size="9" letter-spacing="1">RFC 6238</text><text x="650" y="579" fill="#6f7b75" font-family="monospace" font-size="9" letter-spacing="1">6 DIGITS</text><text x="746" y="579" fill="#6f7b75" font-family="monospace" font-size="9" letter-spacing="1">30 SEC</text>
</svg>
