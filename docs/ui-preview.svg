<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PI Remote Edge Console UI</title>
  <desc id="desc">Dark industrial SSH console with the This Pi loopback target enabled</desc>
  <rect width="1280" height="720" fill="#080b0d"/>
  <rect x="24" y="20" width="1232" height="60" rx="10" fill="#10161a" stroke="#263038"/>
  <circle cx="55" cy="50" r="7" fill="#c7ff31"/><text x="76" y="57" fill="#e9f0f2" font-family="monospace" font-size="22" font-weight="700">PI//REMOTE</text>
  <text x="1140" y="56" fill="#c7ff31" font-family="monospace" font-size="13">GATEWAY ONLINE</text>
  <rect x="24" y="96" width="392" height="600" rx="12" fill="#10161a" stroke="#263038"/>
  <text x="50" y="133" fill="#839099" font-family="monospace" font-size="12">NEW CONNECTION</text>
  <text x="50" y="169" fill="#eef4f5" font-family="sans-serif" font-size="26" font-weight="700">Open remote session</text>
  <text x="50" y="220" fill="#839099" font-family="monospace" font-size="11">PROTOCOL</text>
  <rect x="50" y="232" width="340" height="48" rx="6" fill="#090d10" stroke="#35414a"/><text x="68" y="262" fill="#eef4f5" font-family="monospace" font-size="14">SSH — Terminal</text>
  <text x="50" y="318" fill="#839099" font-family="monospace" font-size="11">TARGET HOST</text>
  <rect x="50" y="330" width="340" height="52" rx="6" fill="#101a16" stroke="#7da03d"/><rect x="64" y="342" width="30" height="28" rx="3" fill="#0b1012" stroke="#7da03d"/><text x="106" y="351" fill="#eef4f5" font-family="monospace" font-size="12" font-weight="700">THIS PI</text><text x="106" y="369" fill="#839099" font-family="monospace" font-size="10">SSH THROUGH 127.0.0.1:22</text><rect x="350" y="346" width="26" height="16" rx="3" fill="#c7ff31"/><circle cx="368" cy="354" r="5" fill="#10161a"/>
  <rect x="50" y="396" width="240" height="48" rx="6" fill="#090d10" stroke="#52643e"/><text x="68" y="426" fill="#eef4f5" font-family="monospace" font-size="13">127.0.0.1</text>
  <rect x="300" y="396" width="90" height="48" rx="6" fill="#090d10" stroke="#52643e"/><text x="334" y="426" fill="#eef4f5" font-family="monospace" font-size="13">22</text>
  <rect x="50" y="472" width="340" height="48" rx="6" fill="#090d10" stroke="#35414a"/><text x="68" y="502" fill="#536069" font-family="monospace" font-size="13">Username</text>
  <rect x="50" y="536" width="340" height="48" rx="6" fill="#090d10" stroke="#35414a"/><text x="68" y="566" fill="#536069" font-family="monospace" font-size="13">••••••••••••</text>
  <rect x="50" y="606" width="340" height="58" rx="6" fill="#c7ff31"/><text x="89" y="641" fill="#0b0f10" font-family="monospace" font-size="15" font-weight="700">START SESSION</text>
  <rect x="432" y="96" width="824" height="600" rx="12" fill="#0c1114" stroke="#263038"/>
  <rect x="450" y="114" width="788" height="52" rx="7" fill="#12191d"/><text x="474" y="146" fill="#9ba7ad" font-family="monospace" font-size="12">NO SESSION  ·  AWAITING TARGET</text>
  <circle cx="844" cy="397" r="108" fill="none" stroke="#202c31"/><circle cx="844" cy="397" r="71" fill="none" stroke="#202c31"/><circle cx="844" cy="397" r="34" fill="none" stroke="#c7ff31" stroke-opacity=".45"/>
  <path d="M844 270V524M717 397H971M754 307L934 487M934 307L754 487" stroke="#202c31"/>
  <circle cx="844" cy="397" r="6" fill="#c7ff31"/>
  <text x="790" y="555" fill="#e9f0f2" font-family="monospace" font-size="16" font-weight="700">NO SESSION</text>
  <text x="720" y="582" fill="#69767d" font-family="monospace" font-size="12">ENTER A TARGET TO BEGIN</text>
